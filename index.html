<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #191919;
            --card-bg: #383836;
            --text-color: #ffffff;
            --line: rgba(0,0,0,0.4);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --card-bg: #f7f7f7;
                --text-color: #37352f;
                --line: rgba(0,0,0,0.1);
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        .clock { display: flex; gap: 20px; }

        /* The Container */
        .flip-card {
            position: relative;
            width: 120px;
            height: 160px;
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 80px;
            font-weight: bold;
            color: var(--text-color);
            text-align: center;
            line-height: 160px;
        }

        /* Top and Bottom Halves */
        .top, .bottom, .flap-down {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: var(--card-bg);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .top {
            top: 0;
            border-radius: 8px 8px 0 0;
            line-height: 160px;
            border-bottom: 1px solid var(--line);
        }

        .bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            line-height: 0;
        }

        /* The Animated Flap */
        .flap-down {
            top: 0;
            border-radius: 8px 8px 0 0;
            line-height: 160px;
            z-index: 3;
            transform-origin: bottom;
            border-bottom: 1px solid var(--line);
            transition: transform 0.6s ease-in;
        }

        .flipping .flap-down {
            transform: rotateX(-180deg);
        }
    </style>
</head>
<body>

    <div class="clock">
        <div class="flip-card" id="hours-card">
            <div class="top">00</div>
            <div class="bottom">00</div>
            <div class="flap-down">00</div>
        </div>
        <div class="flip-card" id="minutes-card">
            <div class="top">00</div>
            <div class="bottom">00</div>
            <div class="flap-down">00</div>
        </div>
    </div>

    <script>
        let lastH, lastM;

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');

            if (h !== lastH) {
                flip(document.getElementById('hours-card'), h);
                lastH = h;
            }
            if (m !== lastM) {
                flip(document.getElementById('minutes-card'), m);
                lastM = m;
            }
        }

        function flip(card, newValue) {
            const top = card.querySelector('.top');
            const bottom = card.querySelector('.bottom');
            const flap = card.querySelector('.flap-down');

            // 1. Set current value to flap and bottom
            // 2. Set new value to top (the background waiting to be revealed)
            top.textContent = newValue;
            
            card.classList.add('flipping');

            setTimeout(() => {
                card.classList.remove('flipping');
                bottom.textContent = newValue;
                flap.textContent = newValue;
            }, 600);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
