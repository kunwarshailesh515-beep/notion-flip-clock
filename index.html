<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #191919;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Inter, -apple-system, sans-serif;
}
@media (prefers-color-scheme: light) { body { background: #fff; } }

.wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2vw;
}

.row { display: flex; gap: 1.5vw; }

.card {
  position: relative;
  width: 16vw;
  height: 21vw;
  border-radius: 6px;
  font-size: 14vw;
  font-weight: 700;
  color: #fff;
  perspective: 800px;
}
@media (prefers-color-scheme: light) { .card { color: #37352f; } }

.half {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  background: #2d2d2b;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
@media (prefers-color-scheme: light) { .half { background: #efefed; } }

.t {
  top: 0;
  border-radius: 6px 6px 0 0;
  border-bottom: 1px solid rgba(0,0,0,0.4);
  transform-origin: center bottom;
}

.b {
  bottom: 0;
  border-radius: 0 0 6px 6px;
  transform-origin: center top;
}

/* num is a full-card-height box inside each half-height div.
   In .t it's anchored to top → we see top portion of digit.
   In .b it's anchored to bottom → we see bottom portion of digit. */
.num {
  position: absolute;
  left: 0; right: 0;
  height: 21vw;
  display: flex;
  align-items: center;
  justify-content: center;
}
.t .num { top: 0; }
.b .num { bottom: 0; }

.bg-t { z-index: 1; }
.bg-b { z-index: 1; }
.fl-t { z-index: 3; }
.fl-b { z-index: 3; transform: rotateX(90deg); }

.card.go .fl-t { animation: foldT 0.25s ease-in forwards; }
.card.go .fl-b { animation: foldB 0.25s ease-out 0.25s forwards; }

@keyframes foldT { to   { transform: rotateX(-90deg); } }
@keyframes foldB { from { transform: rotateX(90deg); } to { transform: rotateX(0deg); } }

.date-txt {
  font-size: 2.5vw;
  font-weight: 500;
  letter-spacing: 0.4em;
  color: rgba(255,255,255,0.55);
  white-space: nowrap;
}
@media (prefers-color-scheme: light) { .date-txt { color: rgba(55,53,47,0.5); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="row">
    <div class="card" id="hCard">
      <div class="half t bg-t"><span class="num" id="hBT"></span></div>
      <div class="half b bg-b"><span class="num" id="hBB"></span></div>
      <div class="half t fl-t"><span class="num" id="hFT"></span></div>
      <div class="half b fl-b"><span class="num" id="hFB"></span></div>
    </div>
    <div class="card" id="mCard">
      <div class="half t bg-t"><span class="num" id="mBT"></span></div>
      <div class="half b bg-b"><span class="num" id="mBB"></span></div>
      <div class="half t fl-t"><span class="num" id="mFT"></span></div>
      <div class="half b fl-b"><span class="num" id="mFB"></span></div>
    </div>
  </div>
  <div class="date-txt" id="dt"></div>
</div>

<script>
const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
let pH = null, pM = null;
const $ = id => document.getElementById(id);

function setAll(p, v) {
  $(`${p}BT`).textContent = v;
  $(`${p}BB`).textContent = v;
  $(`${p}FT`).textContent = v;
  $(`${p}FB`).textContent = v;
}

function flip(cardId, p, oldV, newV) {
  $(`${p}BT`).textContent = newV;
  $(`${p}BB`).textContent = oldV;
  $(`${p}FT`).textContent = oldV;
  $(`${p}FB`).textContent = newV;
  const c = $(cardId);
  c.classList.remove('go');
  void c.offsetWidth;
  c.classList.add('go');
  setTimeout(() => {
    $(`${p}BB`).textContent = newV;
    $(`${p}FT`).textContent = newV;
    c.classList.remove('go');
  }, 550);
}

function tick() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');

  if (pH === null) setAll('h', h);
  else if (h !== pH) flip('hCard', 'h', pH, h);
  pH = h;

  if (pM === null) setAll('m', m);
  else if (m !== pM) flip('mCard', 'm', pM, m);
  pM = m;

  const d = now.getDate().toString().padStart(2, '0');
  const mo = (now.getMonth() + 1).toString().padStart(2, '0');
  $('dt').textContent = `${DAYS[now.getDay()]}  ${d}|${mo}`;
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
