<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #191919;
      --card: #383836;
      --text: #ffffff;
      --line: rgba(0,0,0,0.35);
      --date: rgba(255,255,255,0.6);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --card: #f0f0ee;
        --text: #37352f;
        --line: rgba(0,0,0,0.15);
        --date: rgba(55,53,47,0.55);
      }
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", -apple-system, sans-serif;
    }

    .clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 3cqw;
      container-type: inline-size;
      padding: 4cqw 2cqw;
    }

    .clock-row {
      display: flex;
      gap: 2cqw;
    }

    .flip-unit {
      position: relative;  /* critical: panels are absolute inside this */
      display: block;
      width: 28cqw;
      height: 37cqw;
      font-size: 20cqw;
      font-weight: bold;
      color: var(--text);
      perspective: 600px;
    }

    .panel {
      position: absolute;  /* all 4 panels sit on top of each other */
      left: 0;
      width: 100%;
      height: 50%;
      background: var(--card);
      overflow: hidden;
      display: flex;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .panel-top {
      top: 0;
      border-radius: 5px 5px 0 0;
      align-items: flex-end;
      padding-bottom: 0.5cqw;
      border-bottom: 1px solid var(--line);
      transform-origin: bottom;
    }

    .panel-bottom {
      bottom: 0;
      border-radius: 0 0 5px 5px;
      align-items: flex-start;
      padding-top: 0.5cqw;
      transform-origin: top;
    }

    .bg-top    { z-index: 1; }
    .bg-bottom { z-index: 1; }
    .flap-top  { z-index: 2; transform: rotateX(0deg); }
    .flap-bottom { z-index: 2; transform: rotateX(90deg); }

    .flipping .flap-top {
      animation: flipTop 0.3s cubic-bezier(0.4,0,1,1) forwards;
    }
    .flipping .flap-bottom {
      animation: flipBot 0.3s cubic-bezier(0,0,0.2,1) 0.3s forwards;
    }

    @keyframes flipTop {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-90deg); }
    }

    @keyframes flipBot {
      from { transform: rotateX(90deg); }
      to   { transform: rotateX(0deg); }
    }

    .date-label {
      font-size: 4cqw;
      font-weight: 500;
      letter-spacing: 0.4em;
      color: var(--date);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="clock-wrap">
    <div class="clock-row">
      <div class="flip-unit" id="hours">
        <div class="panel panel-top bg-top"></div>
        <div class="panel panel-bottom bg-bottom"></div>
        <div class="panel panel-top flap-top"></div>
        <div class="panel panel-bottom flap-bottom"></div>
      </div>
      <div class="flip-unit" id="minutes">
        <div class="panel panel-top bg-top"></div>
        <div class="panel panel-bottom bg-bottom"></div>
        <div class="panel panel-top flap-top"></div>
        <div class="panel panel-bottom flap-bottom"></div>
      </div>
    </div>
    <div class="date-label" id="date"></div>
  </div>

  <script>
    let lastH, lastM;
    const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

    function initCard(id, v) {
      document.getElementById(id).querySelectorAll('.panel').forEach(p => p.textContent = v);
    }

    function triggerFlip(id, oldV, newV) {
      const unit = document.getElementById(id);
      unit.querySelector('.bg-top').textContent = newV;
      unit.querySelector('.bg-bottom').textContent = oldV;
      unit.querySelector('.flap-top').textContent = oldV;
      unit.querySelector('.flap-bottom').textContent = newV;
      unit.classList.remove('flipping');
      void unit.offsetWidth;
      unit.classList.add('flipping');
      setTimeout(() => {
        unit.querySelector('.bg-bottom').textContent = newV;
        unit.querySelector('.flap-top').textContent = newV;
        unit.classList.remove('flipping');
      }, 620);
    }

    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');

      if (h !== lastH) {
        lastH === undefined ? initCard('hours', h) : triggerFlip('hours', lastH, h);
        lastH = h;
      }
      if (m !== lastM) {
        lastM === undefined ? initCard('minutes', m) : triggerFlip('minutes', lastM, m);
        lastM = m;
      }

      const d  = now.getDate().toString().padStart(2, '0');
      const mo = (now.getMonth() + 1).toString().padStart(2, '0');
      document.getElementById('date').textContent = days[now.getDay()] + '  ' + d + '|' + mo;
    }

    setInterval(tick, 1000);
    tick();
  </script>

</body>
</html>
