<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #191919;
            --card-bg: #383836;
            --text-color: #ffffff;
            --shadow: rgba(0,0,0,0.5);
            --line: rgba(0,0,0,0.3);
        }

        /* Light Mode & Notion Light Mode Detection */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --card-bg: #f7f7f7;
                --text-color: #37352f;
                --shadow: rgba(0,0,0,0.1);
                --line: rgba(0,0,0,0.1);
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Inter", -apple-system, sans-serif;
            transition: background-color 0.3s ease;
        }

        .clock {
            display: flex;
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            color: var(--text-color);
            width: 120px;
            height: 160px;
            border-radius: 8px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            font-weight: bold;
            box-shadow: 0 10px 20px var(--shadow);
            overflow: hidden;
        }

        /* The horizontal line */
        .card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--line);
            z-index: 2;
        }

        /* Simple Flip Animation */
        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-animate {
            animation: flip 0.6s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="clock">
        <div class="card" id="hours">00</div>
        <div class="card" id="minutes">00</div>
    </div>

    <script>
        let lastH, lastM;

        function updateClock() {
            const now = new Date();
            // 24-hour format: simply pad the raw hours
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');

            // Only trigger animation and update if the value changes
            if (h !== lastH) {
                animateFlip(hoursEl, h);
                lastH = h;
            }
            if (m !== lastM) {
                animateFlip(minutesEl, m);
                lastM = m;
            }
        }

        function animateFlip(el, newValue) {
            el.classList.remove('flip-animate');
            void el.offsetWidth; // Trigger reflow to restart animation
            el.classList.add('flip-animate');
            
            // Update text halfway through the flip
            setTimeout(() => {
                el.textContent = newValue;
            }, 300);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
