<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #191919;
            --card-bg: #383836;
            --text-color: #ffffff;
            --line: rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --card-bg: #f7f7f7;
                --text-color: #37352f;
                --line: rgba(0, 0, 0, 0.1);
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Inter", -apple-system, sans-serif;
            transition: background-color 0.3s ease;
        }

        /* New container to stack the clock and date */
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* Space between clock and date */
        }

        .clock {
            display: flex;
            gap: 15px;
        }

        /* Scaled down by 15% */
        .flip-unit {
            position: relative;
            width: 102px;   /* Was 120px */
            height: 136px;  /* Was 160px */
            border-radius: 8px;
            font-size: 68px; /* Was 80px */
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            perspective: 1000px; 
        }

        .panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: var(--card-bg);
            overflow: hidden;
            text-align: center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .panel-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            line-height: 136px; /* Scaled to match new height */
            border-bottom: 1px solid var(--line); 
            transform-origin: bottom; 
        }

        .panel-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            line-height: 0; 
            transform-origin: top; 
        }

        .bg-top { z-index: 1; }
        .bg-bottom { z-index: 1; }
        .flap-top { z-index: 2; transform: rotateX(0deg); }
        .flap-bottom { z-index: 2; transform: rotateX(90deg); }

        .flipping .flap-top {
            animation: flipDownTop 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        .flipping .flap-bottom {
            animation: flipDownBottom 0.3s cubic-bezier(0, 0, 0.2, 1) 0.3s forwards;
        }

        @keyframes flipDownTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipDownBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        /* Styling for the new date text */
        .date-display {
            color: var(--text-color);
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 2px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="clock">
            <div class="flip-unit" id="hours">
                <div class="panel panel-top bg-top">00</div>
                <div class="panel panel-bottom bg-bottom">00</div>
                <div class="panel panel-top flap-top">00</div>
                <div class="panel panel-bottom flap-bottom">00</div>
            </div>

            <div class="flip-unit" id="minutes">
                <div class="panel panel-top bg-top">00</div>
                <div class="panel panel-bottom bg-bottom">00</div>
                <div class="panel panel-top flap-top">00</div>
                <div class="panel panel-bottom flap-bottom">00</div>
            </div>
        </div>
        
        <div class="date-display" id="date"></div>
    </div>

    <script>
        let lastH, lastM;
        const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        function updateClock() {
            const now = new Date();
            
            // --- Time Logic ---
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');

            if (h !== lastH) {
                if (lastH !== undefined) triggerFlip('hours', lastH, h);
                else initCard('hours', h);
                lastH = h;
            }

            if (m !== lastM) {
                if (lastM !== undefined) triggerFlip('minutes', lastM, m);
                else initCard('minutes', m);
                lastM = m;
            }

            // --- Date Logic ---
            const dayName = daysOfWeek[now.getDay()];
            const dateNum = String(now.getDate()).padStart(2, '0');
            // getMonth() is 0-indexed (Jan is 0), so we add 1
            const monthNum = String(now.getMonth() + 1).padStart(2, '0'); 
            
            const dateString = `${dayName}, ${dateNum}/${monthNum}`;
            document.getElementById('date').textContent = dateString;
        }

        function initCard(id, value) {
            const unit = document.getElementById(id);
            unit.querySelector('.bg-top').textContent = value;
            unit.querySelector('.bg-bottom').textContent = value;
            unit.querySelector('.flap-top').textContent = value;
            unit.querySelector('.flap-bottom').textContent = value;
        }

        function triggerFlip(id, oldVal, newVal) {
            const unit = document.getElementById(id);
            const bgTop = unit.querySelector('.bg-top');
            const bgBottom = unit.querySelector('.bg-bottom');
            const flapTop = unit.querySelector('.flap-top');
            const flapBottom = unit.querySelector('.flap-bottom');

            bgTop.textContent = newVal;       
            bgBottom.textContent = oldVal;    
            flapTop.textContent = oldVal;     
            flapBottom.textContent = newVal;  

            unit.classList.remove('flipping');
            void unit.offsetWidth; 
            unit.classList.add('flipping');

            setTimeout(() => {
                bgBottom.textContent = newVal;
                flapTop.textContent = newVal;
                unit.classList.remove('flipping');
            }, 600);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
