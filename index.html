<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #191919;
            --card-bg: #383836;
            --text-color: #ffffff;
            --line: rgba(0, 0, 0, 0.3);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #ffffff;
                --card-bg: #f7f7f7;
                --text-color: #37352f;
                --line: rgba(0, 0, 0, 0.1);
            }
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Inter", -apple-system, sans-serif;
            transition: background-color 0.3s ease;
        }

        .clock {
            display: flex;
            gap: 15px;
        }

        /* The main container for each time block (Hours / Minutes) */
        .flip-unit {
            position: relative;
            width: 120px;
            height: 160px;
            border-radius: 8px;
            font-size: 80px;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            perspective: 1000px; /* Gives the 3D falling effect */
        }

        /* The 4 separate panels that make up a single card */
        .panel {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background: var(--card-bg);
            overflow: hidden;
            text-align: center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Top panels (Static background + Animated flap) */
        .panel-top {
            top: 0;
            border-radius: 8px 8px 0 0;
            line-height: 160px; /* Vertically centers the top half of the text */
            border-bottom: 1px solid var(--line); /* The crease */
            transform-origin: bottom; /* Hinges at the bottom edge */
        }

        /* Bottom panels (Static background + Animated flap) */
        .panel-bottom {
            bottom: 0;
            border-radius: 0 0 8px 8px;
            line-height: 0; /* Vertically centers the bottom half of the text */
            transform-origin: top; /* Hinges at the top edge */
        }

        /* Z-indexes to layer the flaps over the backgrounds */
        .bg-top { z-index: 1; }
        .bg-bottom { z-index: 1; }
        .flap-top { z-index: 2; transform: rotateX(0deg); }
        .flap-bottom { z-index: 2; transform: rotateX(90deg); }

        /* The Animation Keyframes */
        .flipping .flap-top {
            /* Falls away towards the user */
            animation: flipDownTop 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        .flipping .flap-bottom {
            /* Completes the fall from the middle down to the bottom */
            animation: flipDownBottom 0.3s cubic-bezier(0, 0, 0.2, 1) 0.3s forwards;
        }

        @keyframes flipDownTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipDownBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }
    </style>
</head>
<body>

    <div class="clock">
        <div class="flip-unit" id="hours">
            <div class="panel panel-top bg-top">00</div>
            <div class="panel panel-bottom bg-bottom">00</div>
            <div class="panel panel-top flap-top">00</div>
            <div class="panel panel-bottom flap-bottom">00</div>
        </div>

        <div class="flip-unit" id="minutes">
            <div class="panel panel-top bg-top">00</div>
            <div class="panel panel-bottom bg-bottom">00</div>
            <div class="panel panel-top flap-top">00</div>
            <div class="panel panel-bottom flap-bottom">00</div>
        </div>
    </div>

    <script>
        let lastH, lastM;

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');

            if (h !== lastH) {
                if (lastH !== undefined) triggerFlip('hours', lastH, h);
                else initCard('hours', h);
                lastH = h;
            }

            if (m !== lastM) {
                if (lastM !== undefined) triggerFlip('minutes', lastM, m);
                else initCard('minutes', m);
                lastM = m;
            }
        }

        function initCard(id, value) {
            const unit = document.getElementById(id);
            unit.querySelector('.bg-top').textContent = value;
            unit.querySelector('.bg-bottom').textContent = value;
            unit.querySelector('.flap-top').textContent = value;
            unit.querySelector('.flap-bottom').textContent = value;
        }

        function triggerFlip(id, oldVal, newVal) {
            const unit = document.getElementById(id);
            const bgTop = unit.querySelector('.bg-top');
            const bgBottom = unit.querySelector('.bg-bottom');
            const flapTop = unit.querySelector('.flap-top');
            const flapBottom = unit.querySelector('.flap-bottom');

            // 1. Prepare the elements for the visual flip
            bgTop.textContent = newVal;       // The static top background waits with the NEW number
            bgBottom.textContent = oldVal;    // The static bottom stays on the OLD number
            flapTop.textContent = oldVal;     // The falling flap shows the OLD number
            flapBottom.textContent = newVal;  // The finishing flap shows the NEW number

            // 2. Trigger the CSS animation
            unit.classList.remove('flipping');
            void unit.offsetWidth; // This forces the browser to reset the animation
            unit.classList.add('flipping');

            // 3. Clean up the DOM after the 600ms animation finishes
            setTimeout(() => {
                bgBottom.textContent = newVal;
                flapTop.textContent = newVal;
                unit.classList.remove('flipping');
            }, 600);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
